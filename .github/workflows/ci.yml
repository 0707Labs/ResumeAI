# Checks for every pull request and every push to master.
# Required-check candidates (job names as GitHub shows them): backend, frontend, e2e, docker, secret-scan.
# dependency-audit always passes and only reports; don't make it required.
#
# Only fake values live here. Nothing reaches Anthropic, Dodo or SES:
# - ANTHROPIC_API_KEY is empty, so the app runs rules-only and tests use stub clients.
# - Dodo calls are answered by mocked transports in tests; e2e signs its own test webhooks.
# - RT_MAILER=outbox writes mail to backend/.dev-outbox instead of sending it; SES tests mock boto.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: lts/*
  NEXT_TELEMETRY_DISABLED: "1"
  # Fake settings shared by the backend and e2e jobs.
  ANTHROPIC_API_KEY: ""
  RT_MAILER: outbox
  RT_AUTH_SECRET: ci-not-a-secret
  DODO_ENVIRONMENT: test
  DODO_API_KEY: ci-not-a-key
  DODO_WEBHOOK_SECRET: ci-not-a-secret
  RT_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/resume_tailor
  # pytest creates and drops throwaway rt_test_* databases through this one.
  RT_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_tailor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Transaction pooling with one server connection, for tests/test_rls_pooling.py.
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: "1"
          MAX_PREPARED_STATEMENTS: "200"
        ports: ["6432:5432"]
    env:
      RT_TEST_PGBOUNCER_URL: postgresql+psycopg://postgres:postgres@localhost:6432/
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check --output-format=github .
      - name: Migrate
        run: .venv/bin/alembic upgrade head
      - name: Pytest
        run: .venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        env:
          BACKEND_URL: http://localhost:8000
        run: npm run build

  # Separate so it can be required or not on its own. Chromium against the real backend
  # (rules-only) and `next dev`, which playwright.config.ts starts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_tailor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # playwright.config.ts and e2e/helpers.ts run backend/.venv/bin/{uvicorn,python}.
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
      - name: Migrate
        working-directory: backend
        run: .venv/bin/alembic upgrade head
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=github,html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # Builds both production images and runs them the way Railway does: migrations (the
  # pre-deploy command), the API with its /health check, each cron command, and the web
  # server proxying to the API through BACKEND_URL.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_tailor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -t rt-api backend
          docker build --build-arg BACKEND_URL=http://localhost:8000 -t rt-web frontend
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint id rt-api -u)" = 10001
          test "$(docker run --rm --entrypoint id rt-web -u)" = 1000
      - name: Migrate (pre-deploy command)
        run: docker run --rm --network host -e RT_DATABASE_URL rt-api python -m app.migrate
      - name: Cron commands
        run: |
          for cmd in "app.billing.cli refresh-aggregates" "app.billing.cli budget-check" \
                     "app.billing.cli purge-expired" "app.auth.cli expire-invites"; do
            docker run --rm --network host -e RT_DATABASE_URL rt-api python -m $cmd
          done
      - name: Start API and web
        run: |
          docker run -d --name api --network host -e RT_DATABASE_URL -e RT_AUTH_SECRET -e PORT=8000 rt-api
          docker run -d --name web --network host -e BACKEND_URL=http://localhost:8000 -e PORT=3000 rt-web
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/robots.txt && break; sleep 2; done
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/health | grep -q '"database":"ok"'
          curl -fsS -g "http://[::1]:8000/health" | grep -q '"database":"ok"'
          curl -fsS http://localhost:3000/health | grep -q '"database":"ok"'
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/ | grep -q 200
      - name: Health is 503 without the database
        run: |
          docker run -d --name api-down --network host -e RT_DATABASE_URL=postgresql+psycopg://x@127.0.0.1:1/x -e PORT=8001 rt-api
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/health)" = 503
      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -50; docker logs web 2>&1 | tail -50

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans the commits in this push or PR; fails only on secrets TruffleHog verified as live.
      - uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c # v3.99.4
        with:
          extra_args: --results=verified

  # Reports known vulnerabilities without blocking: each step may fail, the job passes.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pip-audit
        continue-on-error: true
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]" pip-audit
          .venv/bin/pip-audit --skip-editable
      - name: npm audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=moderate
