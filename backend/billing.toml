# Billing catalog: the one place for product IDs, prices, credit amounts, pass length,
# fair-use caps and payment-fee estimates. Loaded and validated by app/billing/config.py
# (an invalid file fails startup). Handlers never hard-code any of these values.
#
# Prices are minor units (paise, cents) and tax-inclusive: the amount shown is the amount
# paid. Dodo charges what its product says, so these must match the Dodo dashboard;
# they are what we display, never what we send. Change `version` whenever a price,
# credit amount, pass length or cap changes; purchases snapshot it.
#
# PLACEHOLDER PRICES: replace with the real ones before launch.

version = 1

[display]
# True when every Dodo product's price is set to tax-inclusive (see docs/billing.md), so the
# price shown is the price paid. The pricing page words its tax note from this.
prices_include_tax = true

[free]
analyses_per_month = 2        # free tailorings a month (calendar month, UTC); downloads are always paid

# Tailoring is free to try; the clean download pays. Past the free tailorings, starting one
# needs what a download would need (an active pass, Pro, or a credit balance); it spends nothing.
[analyses]
usable_hours = 24             # Claude may be used this long for one analysis

# A download is charged to an active pass under its fair-use cap, then Pro under its cap,
# then credits. Re-downloading the same tailored resume is free for a while after that.
[downloads]
credits_per_download = 1
redownload_free_days = 7
url_ttl_seconds = 120         # signed download links expire after this

[signup]
bonus_credits = 0

# Referrals: a friend who signs up with your link earns you credits, through the ledger.
[referrals]
enabled = true
trigger = "on_first_tailoring"   # or "on_verified_signup"
reward_credits = 1
invitee_reward_credits = 0       # optional welcome credits for the friend
monthly_cap = 10                 # rewards per referrer per calendar month (UTC)
invites_per_user = 5             # invite-only mode: a referral link works as an invite this often
same_ip_review_threshold = 3     # this many referred sign-ups from one network in the window -> admin review
review_window_hours = 24
extra_disposable_domains = []    # added to the built-in list in app/billing/referrals.py

[products.credit_pack_5]
kind = "credit_pack"
name = "Credit pack"
billing = "one_time"
credits = 5
prices = { INR = 49900, USD = 600 }
# Dodo product IDs (pdt_...) per mode; products are separate in test and live mode.
dodo_product_id = { test = "", live = "" }

[products.job_hunt_pass]
kind = "pass"
name = "Job Hunt Pass"
billing = "one_time"
pass_days = 30
fair_use_cap = 40             # analyses per pass
prices = { INR = 99900, USD = 1200 }
dodo_product_id = { test = "", live = "" }

[products.pro_monthly]
kind = "subscription"
name = "Pro"
billing = "subscription"
enabled = false               # feature flag; RT_BILLING_PRO_ENABLED=1 overrides
interval = "month"
fair_use_cap = 100            # analyses per billing period
prices = { INR = 79900, USD = 900 }
dodo_product_id = { test = "", live = "" }

# Estimates for margin reporting only. Dodo's payment object reports no fee, so actual
# fees come from Dodo's reports. Source: dodopayments.com/pricing (read 2026-10-21).
[fees.dodo]
base_pct = 4.0
base_fixed_usd_cents = 40
international_extra_pct = 1.5     # non-US cards and alternative payment methods
india_pct = 4.0                   # domestic INR cards and UPI
india_fixed_usd_cents = 15
subscription_extra_pct = 0.5
refund_fixed_usd_cents = 100
dispute_fixed_usd_cents = 3000
# Set to true if test mode shows Dodo's settlement_amount already has its fees taken off
# (the docs don't say); otherwise the admin margin subtracts the estimates above.
settlement_is_net_of_fees = false

[alerts]
webhook_failures = 3          # a delivery failing this many times raises an alert
daily_llm_spend_usd = 20.0    # LLM spend since 00:00 UTC above this raises an alert

# Claude prices, USD per million tokens (Anthropic first-party, read 2026-10-21).
# cache_write is the 5-minute write rate. A model not listed is recorded with no cost
# and counted as "unpriced" in the admin view, so add it here.
[llm_prices.claude-opus-5-5]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write = 5.0

[llm_prices.claude-opus-5]
input = 5.0
output = 25.0
cache_read = 0.50
cache_write = 6.25

[llm_prices.claude-opus-4-8]
input = 5.0
output = 25.0
cache_read = 0.50
cache_write = 6.25

[llm_prices.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read = 0.20
cache_write = 2.50

[llm_prices.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

[llm_prices.claude-fable-5-1]
input = 10.0
output = 50.0
cache_read = 0.25
cache_write = 12.50
