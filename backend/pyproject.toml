[project]
name = "resume-tailor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.150",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pdfplumber>=0.11",
    "python-docx>=1.2",
    "python-multipart>=0.0.32",
    "anthropic>=1.15",
    "reportlab>=5.0",
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "authlib>=1.9",
    "httpx2>=2.15",
    "joserfc>=1.7",
    "dodopayments[webhooks]>=1.121",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["samples/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
