[project]
name = "resume-tailor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.150",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pdfplumber>=0.11",
    "python-docx>=1.2",
    "python-multipart>=0.0.32",
    "anthropic>=1.15",
    "reportlab>=5.0",
    "pillow>=13.0",       # server-rendered preview images
    "pypdfium2>=5.14",    # rasterizes the preview PDF (also used by pdfplumber)
    "sqlalchemy[asyncio]>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "authlib>=1.9",
    "httpx2>=2.15",
    "joserfc>=1.7",
    "dodopayments[webhooks]>=1.121",
    "sentry-sdk[fastapi]>=2.73",  # optional error reporting, off without SENTRY_DSN
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28", "ruff==0.17.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["samples/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Ruff's classic defaults (pyflakes + the E4/E7/E9 errors). Newer ruff releases widen the
# default set, so it is pinned here rather than inherited.
select = ["E4", "E7", "E9", "F"]
# `l` for a line in short parser comprehensions.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Tests import pytest fixtures and take them as same-named arguments.
"tests/*" = ["F811"]
